<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Ax Deep Dive Update History</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --panel:#fff; --ink:#142033; --muted:#667085; --line:#d8dee9; --accent:#2563eb; --soft:#eaf1ff; --green:#067647; --amber:#b54708; --shadow:0 16px 42px rgba(15,23,42,.08); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); line-height:1.62; }
    a { color:var(--accent); text-decoration:none; overflow-wrap:anywhere; }
    a:hover { text-decoration:underline; }
    main { width:min(1240px, calc(100% - 32px)); margin:30px auto 64px; }
    .hero, section { background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:30px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(34px,5vw,54px); line-height:1.06; letter-spacing:0; }
    h2 { margin:0 0 16px; font-size:24px; letter-spacing:0; }
    p { margin:0 0 13px; }
    .lead { max-width:920px; margin-top:16px; color:#344054; font-size:18px; }
    .meta, .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .pill, .links a { display:inline-flex; border-radius:999px; border:1px solid #bed3ff; background:var(--soft); color:#1e40af; padding:6px 10px; font-size:13px; font-weight:760; }
    table { width:100%; border-collapse:collapse; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:white; }
    th,td { padding:13px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { background:#f1f4f9; color:#344054; font-size:14px; }
    tr:last-child td { border-bottom:0; }
    .tag { display:inline-block; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:850; white-space:nowrap; color:var(--amber); background:#fff7ed; border:1px solid #fed7aa; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .card { border:1px solid var(--line); border-radius:14px; padding:18px; background:#fcfdff; }
    .card strong { display:block; margin-bottom:6px; color:var(--accent); }
    @media (max-width:900px){ main{width:min(100% - 20px,1240px);margin-top:18px;} .grid{grid-template-columns:1fr;} table{font-size:14px;} th,td{padding:10px;} }
</style>
</head>
<body>
  <main>
    <header class="hero">
      <h1>Google Ax Deep Dive Update History</h1>
      <p class="lead">이 리포트의 상세 업데이트 이력은 통합 Document History에서 관리한다.</p>
      <div class="links">
        <a href="index.html">Report</a>
        <a href="../../history/">Document History</a>
        <a href="../../index.html">Report Index</a>
      </div>
    </header>
  </main>
</body>
</html>
