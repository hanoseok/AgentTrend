<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0700 Agent Trend Brief Update History</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --panel:#fff; --ink:#142033; --line:#d8dee9; --accent:#2563eb; --soft:#eaf1ff; --shadow:0 16px 42px rgba(15,23,42,.08); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); line-height:1.62; }
    a { color:var(--accent); text-decoration:none; overflow-wrap:anywhere; }
    a:hover { text-decoration:underline; }
    main { width:min(960px, calc(100% - 32px)); margin:30px auto 64px; }
    .hero { background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:30px; }
    h1 { margin:0; font-size:clamp(30px,5vw,44px); line-height:1.06; letter-spacing:0; }
    p { margin:13px 0 0; color:#344054; }
    .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .links a { display:inline-flex; border-radius:999px; border:1px solid #bed3ff; background:var(--soft); color:#1e40af; padding:6px 10px; font-size:13px; font-weight:760; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1>0700 Agent Trend Brief Update History</h1>
      <p>2026-07-03 07:00 KST에 생성된 정기 브리프다. 상세 업데이트 이력은 통합 Document History에서 관리한다.</p>
      <div class="links">
        <a href="index.html">Report</a>
        <a href="../../../history/">Document History</a>
        <a href="../../../index.html">Report Index</a>
      </div>
    </header>
  </main>
</body>
</html>
